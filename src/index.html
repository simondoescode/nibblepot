const storeKey='nibblepot-demo-v1';
let data;try{data=JSON.parse(localStorage.getItem(storeKey)||'null')}catch{}
if(!data||!Array.isArray(data.larder))data={larder:['potatoes','baked-beans','rice','pasta','chopped-tomatoes','eggs','cheese'],favorites:[],shopping:[]};
if(!Array.isArray(data.favorites))data.favorites=[];if(!Array.isArray(data.shopping))data.shopping=[];
const state={tab:'home',filter:'all',query:'',modal:null};
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(data))}catch{}};
let toastTimer;
function toast(msg){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.remove(),2400)}
const nav=[['home','🍽️','Recipes'],['favorites','❤️','Favourites'],['larder','🫙','Larder'],['shopping','🛒','Shopping']];
function navMarkup(cls){return nav.map(([id,icon,label])=>`<button class="${cls} ${state.tab===id?'active':''}" type="button" data-tab="${id}" aria-label="${label}" ${state.tab===id?'aria-current="page"':''}>${cls==='navbtn'?'':`<span aria-hidden="true">${icon}</span>`}${label}${cls==='navbtn'&&id==='shopping'&&data.shopping.length?`<span class="nav-count">${data.shopping.length}</span>`:''}</button>`).join('')}
function art(r,large=false){return `<div class="${large?'modal-art':'recipe-pic'}" style="background:${r.color}">${!large?`<span class="tiny-label">${r.mins} min</span>`:''}<div class="food-plate"><span class="food-emoji" role="img" aria-label="${esc(r.title)}">${r.emoji}</span></div>${!large?`<button class="heart ${data.favorites.includes(r.id)?'saved':''}" aria-label="${data.favorites.includes(r.id)?'Remove from':'Add to'} favourites" aria-pressed="${data.favorites.includes(r.id)}" data-fav="${r.id}">${data.favorites.includes(r.id)?'♥':'♡'}</button>`:''}</div>`}
function recipeCard(r){const count=r.ing.filter(x=>data.larder.includes(x.id)).length;return `<article class="recipe-card">${art(r)}<div class="recipe-info"><h3>${esc(r.title)}</h3><p>${esc(r.description)}</p><div class="card-foot"><span class="foot-meta">🫙 ${count}/${r.ing.length} in larder</span><button class="open-recipe" data-recipe="${r.id}">View →</button></div></div></article>`}
function grid(items){return items.length?`<div class="recipe-grid">${items.map(recipeCard).join('')}</div>`:`<div class="empty"><div class="empty-icon">🍽️</div><h3>No recipes found</h3><p>Try another search or filter.</p><button class="btn btn-primary btn-small" data-reset-filters>Show everything</button></div>`}
function filtered(){let rs=recipes.filter(r=>!state.query||(`${r.title} ${r.description} ${r.ing.map(x=>ingredients[x.id]?.[0]).join(' ')}`).toLowerCase().includes(state.query.toLowerCase()));if(state.filter==='quick')rs=rs.filter(r=>r.mins<=30);if(state.filter==='onepot')rs=rs.filter(r=>r.onePot);if(state.filter==='simple')rs=rs.filter(r=>r.ing.length<=5);if(state.filter==='larder')rs=rs.slice().sort((a,b)=>(b.ing.filter(x=>data.larder.includes(x.id)).length/b.ing.length)-(a.ing.filter(x=>data.larder.includes(x.id)).length/a.ing.length));return rs}
function home(){return `<section class="hero"><div class="hero-content"><span class="eyebrow">✳️ Good grub. Zero faff.</span><h1>What's for<br><em>tea?</em></h1><p>Easy, budget-friendly family dinners. No waffle, no weird ingredients. Just food.</p><div class="actions"><button class="btn btn-primary" data-random>🎲 Surprise me!</button><button class="btn btn-cream" data-tab="larder">🫙 My larder</button></div></div><div class="hero-art"><div class="art-disk"></div><div class="art-squiggle"></div><div class="hero-pot">${mascot}</div><span class="float-food ff-1">🥕</span><span class="float-food ff-2">🍅</span><span class="float-food ff-3">🥦</span><span class="mini-burst">✳</span></div></section><div class="section-heading"><div><h2>What takes your fancy? <span aria-hidden="true">✳</span></h2><p>${recipes.length} easy recipes, all made for real life.</p></div><label class="search"><span aria-hidden="true">🔎</span><input type="search" id="search" placeholder="Search meals or ingredients" value="${esc(state.query)}" aria-label="Search recipes"></label></div><div class="chips" aria-label="Recipe filters">${[['all','All recipes'],['quick','⚡ 30 mins or less'],['simple','✋ 5 ingredients'],['onepot','🍲 One pot'],['larder','🫙 Use my larder']].map(([id,name])=>`<button class="chip ${state.filter===id?'selected':''}" data-filter="${id}" aria-pressed="${state.filter===id}">${name}</button>`).join('')}</div><div id="home-results">${grid(filtered())}</div>`}
function favoritePage(){let fav=recipes.filter(r=>data.favorites.includes(r.id));return `<div class="page-intro pink"><div><h2>Saved for later. ❤️</h2><p>Your tried-and-true tea-time favourites.</p></div><div class="intro-icon">💘</div></div>${fav.length?grid(fav):`<div class="empty"><div class="empty-icon">♡</div><h3>Nothing saved yet</h3><p>Tap the heart on any recipe to keep it here.</p><button class="btn btn-primary btn-small" data-tab="home">Find a favourite</button></div>`}`}
function larderPage(){const groups=['Cupboard','Fridge','Freezer'];const total=data.larder.length;return `<div class="page-intro"><div><h2>What's in your larder? 🫙</h2><p>Tick what you've got. We'll do the thinking.</p></div><div class="intro-icon">🥫</div></div><div class="larder-layout"><div>${groups.map(g=>`<section class="panel"><h3>${g==='Cupboard'?'🥫':g==='Fridge'?'🧀':'❄️'} ${g}</h3><div class="item-grid">${Object.entries(ingredients).filter(([id,v])=>v[1]===g).map(([id,v])=>`<label class="larder-item"><input type="checkbox" value="${id}" data-pantry ${data.larder.includes(id)?'checked':''}><span>${esc(v[0])}</span></label>`).join('')}</div></section>`).join('')}</div><aside class="larder-aside"><span>✨ YOU'RE STOCKED!</span><div class="big">${total}</div><strong>ingredients ready to go</strong><p>See which dinners need the fewest extra bits. Your larder stays on this device.</p><button class="btn btn-primary" data-match>🍳 What can I make?</button><p style="font-size:12px;margin-bottom:0">We've added a few example ingredients to get you started. Change them to match your cupboards.</p></aside></div>`}
function shoppingPage(){const entries=data.shopping;return `<div class="page-intro blue"><div><h2>Shopping, sorted. 🛒</h2><p>Just the bits you're missing. No giant lists.</p></div><div class="intro-icon">🧺</div></div>${entries.length?`<div class="shop-actions"><button class="btn btn-cream btn-small" data-copy>📋 Copy list</button><button class="btn btn-cream btn-small" data-clear-done>✓ Remove ticked items</button></div><div class="shop-list">${entries.map(s=>`<div class="shop-row ${s.done?'done':''}"><input type="checkbox" aria-label="Mark ${esc(ingredients[s.id]?.[0]||s.id)} as purchased" data-shop-check="${s.id}" ${s.done?'checked':''}><div class="shop-item"><strong>${esc(ingredients[s.id]?.[0]||s.id)}</strong><small>${s.from?.length?`For ${s.from.length} recipe${s.from.length===1?'':'s'} · see recipe for quantities`:'Added to your list'}</small></div><a class="tesco-link" target="_blank" rel="noopener noreferrer" href="https://www.tesco.com/shop/en-GB/search?query=${encodeURIComponent(ingredients[s.id]?.[0]||s.id)}" aria-label="Find ${esc(ingredients[s.id]?.[0]||s.id)} at Tesco">Tesco ↗</a><button type="button" data-shop-remove="${s.id}" aria-label="Remove ${esc(ingredients[s.id]?.[0]||s.id)}" style="background:transparent;border:0;font-size:22px">×</button></div>`).join('')}</div>`:`<div class="empty"><div class="empty-icon">🧺</div><h3>Looking delightfully empty.</h3><p>Open a recipe and tap “Add missing ingredients”.</p><button class="btn btn-primary btn-small" data-tab="home">Browse recipes</button></div>`}<div class="info-bar" style="margin-top:24px"><strong>🛍️ Tesco links open product searches</strong><small>Adding items straight to a Tesco basket isn't supported in this demo.</small></div>`}
function modalHtml(){if(!state.modal)return '';const r=recipes.find(x=>x.id===state.modal.id);if(!r)return '';const random=state.modal.kind==='random';return `<div class="overlay" data-overlay><section class="modal" role="dialog" aria-modal="true" aria-label="${random?'Random dinner suggestion':'Recipe'}: ${esc(r.title)}"><button class="modal-close" type="button" data-close aria-label="Close dialog">×</button>${random?`<div class="random-intro">🎲 The dinner gods have spoken!</div>`:''}${art(r,true)}<div class="modal-body"><span class="modal-topline">${random?'Tonight’s pick!':`⏱ ${r.mins} min · Serves 4`}</span><h2>${esc(r.title)}</h2><p>${esc(r.description)} · ${r.mins} minutes · serves 4</p>${random?`<div class="random-actions"><button class="btn btn-primary" data-recipe="${r.id}">🍴 See recipe</button><button class="btn btn-cream" data-random>🎲 Roll again</button></div>`:`<h3>What you'll need</h3>${r.ing.map(x=>`<div class="ingredient-line"><span><strong>${esc(x.qty)}</strong> ${esc(ingredients[x.id]?.[0]||x.id)}</span><span class="stock-tag ${data.larder.includes(x.id)?'have':'need'}">${data.larder.includes(x.id)?'✓ In larder':'+ Need'}</span></div>`).join('')}<h3>Let's make it</h3><ol class="steps">${r.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><div class="modal-actions"><button class="btn btn-primary" data-add-missing="${r.id}">🛒 Add missing bits</button><button class="btn btn-cream" data-fav="${r.id}">${data.favorites.includes(r.id)?'♥ Saved':'♡ Save recipe'}</button></div>`}</div></section></div>`}
function render(preserveSearchFocus=false){let focus=false,pos=0;if(preserveSearchFocus){focus=document.activeElement?.id==='search';pos=focus?document.activeElement.selectionStart:0}app.innerHTML=`<div class="wrap"><header class="header"><button class="brand" data-tab="home" aria-label="Nibblepot home"><span class="brand-pot">${svgPot}</span><span>nibblepot<span class="brand-dot">.</span></span></button><nav class="topnav" aria-label="Main navigation">${navMarkup('navbtn')}</nav><span class="small-print">GOOD GRUB. ZERO FAFF.</span></header><main class="main">${state.tab==='home'?home():state.tab==='favorites'?favoritePage():state.tab==='larder'?larderPage():shoppingPage()}</main><footer class="footer">Made for real-life tea times ✳ Nibblepot demo</footer></div><nav class="mobile-nav" aria-label="Mobile navigation">${navMarkup('mobbtn')}</nav>${modalHtml()}`;document.body.classList.toggle('scrim-open',!!state.modal);if(focus){let input=document.querySelector('#search');input?.focus();input?.setSelectionRange(pos,pos)}}
function navigate(tab){state.tab=tab;state.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function randomMeal(){const prev=state.modal?.id;let options=recipes.filter(r=>r.id!==prev);state.modal={kind:'random',id:options[Math.floor(Math.random()*options.length)].id};render()}
function toggleFav(id){const ix=data.favorites.indexOf(id);if(ix>=0){data.favorites.splice(ix,1);toast('Removed from favourites')}else{data.favorites.push(id);toast('Saved to favourites ❤️')}save();render()}
function addMissing(id){const r=recipes.find(r=>r.id===id);if(!r)return;let count=0;for(const it of r.ing){if(data.larder.includes(it.id))continue;let v=data.shopping.find(i=>i.id===it.id);if(!v){v={id:it.id,done:false,from:[]};data.shopping.push(v);count++}if(!v.from.includes(r.id))v.from.push(r.id)}save();state.modal=null;render();toast(count?`Added ${count} missing ingredient${count===1?'':'s'} 🛒`:'Nothing new to add — nice!')}
app.addEventListener('click',e=>{if(e.target.hasAttribute('data-overlay')){state.modal=null;render();return}const t=e.target.closest('[data-tab],[data-filter],[data-fav],[data-recipe],[data-random],[data-close],[data-match],[data-add-missing],[data-shop-remove],[data-copy],[data-clear-done],[data-reset-filters]');if(!t)return;const d=t.dataset;if(d.tab){navigate(d.tab);return}if(d.filter){state.filter=d.filter;render();return}if(d.fav){toggleFav(d.fav);return}if(d.recipe){state.modal={kind:'recipe',id:d.recipe};render();return}if('random' in d){randomMeal();return}if('close' in d){state.modal=null;render();return}if('match' in d){state.filter='larder';state.query='';navigate('home');return}if(d.addMissing){addMissing(d.addMissing);return}if(d.shopRemove){data.shopping=data.shopping.filter(x=>x.id!==d.shopRemove);save();render();return}if('clearDone' in d){data.shopping=data.shopping.filter(x=>!x.done);save();render();toast('Ticked items cleared');return}if('resetFilters' in d){state.filter='all';state.query='';render();return}if('copy' in d){const str=data.shopping.map(x=>`${x.done?'✓':'☐'} ${ingredients[x.id]?.[0]||x.id}`).join('\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(str).then(()=>toast('Shopping list copied!')).catch(()=>toast('Copy not available here'))}else{toast('Copy not available here')}return}});
app.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-pantry]')){if(t.checked&&!data.larder.includes(t.value))data.larder.push(t.value);if(!t.checked)data.larder=data.larder.filter(x=>x!==t.value);save();render();return}if(t.matches('[data-shop-check]')){const i=data.shopping.find(x=>x.id===t.dataset.shopCheck);if(i)i.done=t.checked;save();render();return}});
app.addEventListener('input',e=>{if(e.target.id==='search'){state.query=e.target.value;const result=document.getElementById('home-results');if(result)result.innerHTML=grid(filtered())}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
render();
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
})();
  </script>
