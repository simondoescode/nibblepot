name: Test and deploy Nibblepot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Capture updated lockfile for reproducible CI
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
      - name: Show npm error details on failure
        if: failure()
        run: cat "$HOME"/.npm/_logs/*-debug-0.log | tail -150 || true
      - run: npm run build
      - run: npm run test
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
