name: Test and deploy Nibblepot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Show npm error details on failure
        if: failure()
        run: cat "$HOME"/.npm/_logs/*-debug-0.log | tail -150 || true
      - run: npm run build
      - run: npm run test
      # Ubuntu 24.04 GitHub-hosted runners include Google Chrome.
      # Avoid Playwright's repeated Chromium downloads and apt installs.
      - name: Check preinstalled Chrome
        run: google-chrome --version
      - run: npm run test:e2e
      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
